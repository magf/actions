# .github/workflows/check-collect-logs.yml
name: Check collect-logs

on:
  pull_request:
    branches: ['**']
    paths:
      - 'collect-logs/**'
      - '.github/workflows/check-collect-logs.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'collect-logs/*.sh')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No tracked *.sh files in collect-logs, skip"
            exit 0
          fi
          shellcheck "${files[@]}"

  functional:
    name: Functional
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Prepare test container
        run: |
          rm -rf logs-output
          mkdir -p logs-output

          docker run -i --name test-logs \
            -v "$PWD/logs-output:/logs" \
            ubuntu:24.04 /bin/bash <<'EOF'
              mkdir -p /gpAdminLogs \
                       /gpdb_src/src/test/results \
                       /gpdb_src/gpAux/gpdemo/datadirs/log \
                       /gpdb_src/gpAux/gpdemo/datadirs/pg_log

              touch /gpAdminLogs/gpadmin.log \
                    /gpdb_src/src/test/results/test1.diffs \
                    /gpdb_src/src/test/results/test2.diffs \
                    /gpdb_src/src/test/results/not_a_diff.txt \
                    /gpdb_src/gpAux/gpdemo/datadirs/log/pg.log \
                    /gpdb_src/gpAux/gpdemo/datadirs/pg_log/pg.log
          EOF

      - name: Run collect-logs action (defaults)
        uses: ./collect-logs

      - name: Check defaults
        run: |
          set -euo pipefail
          cd logs-output
          shopt -s nullglob
          files=(*.tar)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No .tar archives were collected!"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "ARCHIVE: $f"
            tar -tf "$f" | sort | sed 's/^/  /'
          done > ../actual-defaults.out
          cat ../actual-defaults.out

          cd ..
          echo "=== Diff (defaults) ==="
          if ! diff -u collect-logs/test/expected-defaults.out actual-defaults.out; then
            echo "::error::Actual output differs from expected defaults."
            exit 1
          fi

          rm -rf logs-output/*

      - name: Run collect-logs action (custom)
        uses: ./collect-logs
        with:
          log_dir: /logs
          log_path_prefix: test-prefix
          params: |
            gpAdminLogs
            gpdb_src/src/test *.diffs f
            /non/existent/path
            gpdb_src/gpAux/gpdemo/datadirs log

      - name: Check custom
        run: |
          set -euo pipefail
          cd logs-output
          shopt -s nullglob
          files=(*.tar)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No .tar archives were collected!"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "ARCHIVE: $f"
            tar -tf "$f" | sort | sed 's/^/  /'
          done > ../actual-custom.out
          cat ../actual-custom.out

          cd ..
          echo "=== Diff (custom) ==="
          if ! diff -u collect-logs/test/expected-custom.out actual-custom.out; then
            echo "::error::Actual output differs from expected custom."
            exit 1
          fi

      - name: Clean up
        if: always()
        run: docker rm -f test-logs
