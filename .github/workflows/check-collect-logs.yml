# .github/workflows/check-collect-logs.yml
name: Check collect-logs

on:
  pull_request:
    branches: ['**']
    paths:
      - 'collect-logs/**'
      - '.github/workflows/check-collect-logs.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'collect-logs/*.sh' 'collect-logs/*.bash')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No tracked *.sh or *.bash files in collect-logs, skip"
            exit 0
          fi
          shellcheck "${files[@]}"

  functional:
    name: Functional (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: defaults
          - name: custom
            params: |
              gpAdminLogs
              gpdb_src/src/test *.diffs f
              gpdb_src/src/test results
              gpdb_src/gpAux/gpdemo/datadirs log
              gpdb_src/gpAux/gpdemo/datadirs pg_log

    steps:
      - uses: actions/checkout@v7

      - name: Generate test fixtures
        env:
          MATRIX_PARAMS: ${{ matrix.params }}
        run: |
          set -euo pipefail
          if [ -z "$MATRIX_PARAMS" ]; then
            echo "Using defaults from action.yml"
            yq -r '.inputs.params.default' collect-logs/action.yml \
              | bash collect-logs/tests/generate_inc.bash > logs.inc
          else
            echo "Using custom params from matrix"
            echo "$MATRIX_PARAMS" \
              | bash collect-logs/tests/generate_inc.bash > logs.inc
          fi
          
          echo "=== Generated logs.inc ==="
          cat logs.inc

      - name: Create logs in container
        run: |
          docker run -i \
            -v "$PWD/logs:/logs" \
            -v "$PWD/logs.inc:/logs.inc" \
            ubuntu:24.04 /bin/bash < collect-logs/tests/create_logs.bash

      - name: Run collect-logs action ${{ matrix.name }}
        if: matrix.params == ''
        uses: ./collect-logs
        with:
          log_dir: /logs
          log_path_prefix: test-${{ matrix.name }}

      - name: Run collect-logs action ${{ matrix.name }}
        if: matrix.params != ''
        uses: ./collect-logs
        with:
          log_dir: /logs
          log_path_prefix: test-${{ matrix.name }}
          params: ${{ matrix.params }}

      - name: Generate actual output
        run: |
          set -euo pipefail
          ls -lah logs/
          
          for f in logs/*.tar; do
            tar -tf "$f"
          done | sort > actual.out

      - name: Compare with expected output
        run: |
          set -euo pipefail
          cat actual.out
          # echo "=== Diff ==="
          # if ! diff -u collect-logs/test/expected.out actual.out; then
          #   echo "::error::Actual output differs from expected."
          #   exit 1
          # fi
