# .github/workflows/check-apt.yml
name: Check apt

on:
  pull_request:
    branches: ['**']
    paths:
      - 'apt/**'
      - '.github/workflows/check-apt.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'apt/*.sh' 'apt/*.bash')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No tracked *.sh or *.bash files in apt, skip"
            exit 0
          fi
          shellcheck "${files[@]}"

  functional:
    name: Functional
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - name: Dump IMDS raw data
        run: |
          TOKEN=$(curl -X PUT "http://169.254.169.254/latest/api/token" -sH "X-aws-ec2-metadata-token-ttl-seconds: 21600")
          echo " === TOKEN $TOKEN ==="
          echo " === API v2 ==="
          curl -sH "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/
          curl -sH "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone
          curl -sH "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone-id
          curl -sH "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/group-name
          curl -sH "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/host-id
          curl -sH "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/partition-number
          curl -sH "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/region

          echo " === API v1 ==="
          curl -s http://169.254.169.254/latest/meta-data/
          curl -s http://169.254.169.254/latest/meta-data/placement/availability-zone
          curl -s http://169.254.169.254/latest/meta-data/placement/availability-zone-id
          curl -s http://169.254.169.254/latest/meta-data/placement/group-name
          curl -s http://169.254.169.254/latest/meta-data/placement/host-id
          curl -s http://169.254.169.254/latest/meta-data/placement/partition-number
          curl -s http://169.254.169.254/latest/meta-data/placement/region


          echo "=== REGION BEGIN >>>"
          curl -s http://169.254.169.254/latest/dynamic/instance-identity/document | jq -r '.region'
          echo "<<< REGION END ==="

      - uses: ./apt/update
